name: Import refined t14 storyboard image
on:
  push:
    branches:
      - art/t14-classic-force-photo-20261029

jobs:
  import-board:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify supplied storyboard PNG
        env:
          IMAGE_URL: https://at.adobe.com/QWhWbdaxmmdrbmny
          EXPECTED_SHA256: 7ae3ff066628bef9948b5571e07040e9834f36418308e5e4b690349cb47bac17
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 --silent --show-error "$IMAGE_URL" -o /tmp/t14-classic-force-board.png
          echo "$EXPECTED_SHA256  /tmp/t14-classic-force-board.png" | sha256sum --check -
          python3 - <<'PY'
          import struct
          from pathlib import Path
          png=Path("/tmp/t14-classic-force-board.png").read_bytes()
          assert png[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]), "Not a PNG"
          width,height=struct.unpack(">II",png[16:24])
          assert (width,height)==(2520,2161),(width,height)
          print("Validated t14 artwork:",width,height,len(png),"bytes")
          PY
          cp /tmp/t14-classic-force-board.png boards/t14-classic-force-board.png
      - name: Commit artwork and remove temporary import workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boards/t14-classic-force-board.png
          git rm .github/workflows/import-t14-storyboard.yml
          git commit -m "Replace t14 Classic Force board with validated photographic storyboard"
          git push origin HEAD:art/t14-classic-force-photo-20261029
