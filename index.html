<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleight School — Loading…</title>
<style>
body{margin:0;background:#061018;color:#e7f0f3;font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{text-align:center;opacity:.85}
.bar{width:200px;height:4px;background:#1a2a35;border-radius:2px;margin:1rem auto;overflow:hidden}
.fill{height:100%;width:0;background:#8fd0c8;transition:width .2s}
</style>
</head>
<body>
<div class="box">
  <p>Loading Sleight School…</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <p id="status" style="font-size:13px;opacity:.6">0%</p>
</div>
<script>
(async function () {
  const N = 22;
  const parts = [];
  const fill = document.getElementById('fill');
  const status = document.getElementById('status');
  for (let i = 0; i < N; i++) {
    const name = 'chunks/c' + String(i).padStart(3, '0') + '.htmlpart';
    const r = await fetch(name + '?t=' + Date.now());
    if (!r.ok) {
      status.textContent = 'Failed to load ' + name;
      return;
    }
    parts.push(await r.text());
    const pct = Math.round(((i + 1) / N) * 100);
    fill.style.width = pct + '%';
    status.textContent = pct + '%';
  }
  const html = parts.join('');
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
